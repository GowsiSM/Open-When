<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      /* set light/dark before first paint; keep in sync with src/theme.ts */
      (function () { try {
        var t = localStorage.getItem("ow:theme"); if (t !== "dark" && t !== "light") t = "system";
        var m = t === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
        var r = document.documentElement; r.dataset.theme = t; r.dataset.mode = m;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", m === "dark" ? "#0a0a0a" : "#f1eee6");
      } catch (e) {} })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <title>Open When</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
